<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDDIFY_plas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://github.com/HIDDIFYplas/Hiddify_plas/blob/main/Screenshot_%DB%B2%DB%B0%DB%B2%DB%B6-%DB%B0%DB%B7-%DB%B2%DB%B3-%DB%B2%DB%B0-%DB%B5%DB%B7-%DB%B0%DB%B2-%DB%B1%DB%B6%DB%B9_com.camerasideas.instashot.png" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- دکمه تم روز/شب -->
    <button id="themeToggle" class="theme-btn">🌙</button>

    <!-- پس‌زمینه زنده -->
    <canvas id="bg-canvas"></canvas>

    <!-- هدر -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="HIDDIFY_plas Logo" onerror="this.src='https://raw.githubusercontent.com/hiddify/hiddify-config/main/docs/logo.png'">
        </div>
        <h1>HIDDIFY_plas</h1>
        <p>Fast • Secure • Unlimited</p>
        <a id="configButton" href="#" class="mainButton" target="_blank">
            ⚡ دریافت کانفیگ رایگان
        </a>
    </header>

    <!-- وضعیت -->
    <div class="status">
        <div id="statusBox">در حال دریافت وضعیت...</div>
    </div>

    <!-- کانتینر اصلی برنامه‌ها -->
    <main id="appContainer"></main>

    <!-- فوتر -->
    <footer>
        <a id="telegramBtn" href="#" target="_blank">📢 کانال تلگرام</a>
        <a id="supportBtn" href="#" target="_blank">💬 پشتیبانی</a>
        <a id="tutorialBtn" href="#" target="_blank">📚 آموزش اتصال</a>
        <p>© HIDDIFY_plas</p>
    </footer>

    <!-- اسکریپت‌ها -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
